<!DOCTYPE html>

<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresar — Zoo Logic AI Agents</title>

<style>
    * { box-sizing: border-box; }

    body {
        margin: 0;
        font-family: Verdana, Arial, sans-serif;
        background: #f5f7fb;
        color: #1f2937;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .login-box {
        width: 100%;
        max-width: 380px;
        background: white;
        border-radius: 12px;
        box-shadow: 0 4px 18px rgba(17, 24, 39, 0.10);
        overflow: hidden;
    }

    .login-head {
        background: #111827;
        color: white;
        padding: 24px;
        font-size: 21px;
        font-weight: bold;
    }

    .login-head span { color: #3b82f6; }

    .login-body { padding: 24px; }

    label {
        display: block;
        font-size: 12px;
        font-weight: bold;
        margin: 14px 0 6px;
    }

    input {
        width: 100%;
        padding: 11px;
        border: 1px solid #d1d5db;
        border-radius: 7px;
        font-family: inherit;
        font-size: 13px;
    }

    input:focus {
        outline: none;
        border-color: #2563eb;
    }

    button {
        width: 100%;
        margin-top: 20px;
        border: none;
        border-radius: 7px;
        padding: 12px;
        cursor: pointer;
        font-family: inherit;
        font-size: 13px;
        background: #2563eb;
        color: white;
    }

    .error {
        background: #fee2e2;
        color: #991b1b;
        border-radius: 7px;
        padding: 10px 12px;
        font-size: 12px;
        margin-bottom: 4px;
    }

    .muted {
        font-size: 12px;
        color: #6b7280;
        margin: 0 0 4px;
    }
</style>
</head>

<body>

<div class="login-box">

    <div class="login-head">
        Zoo Logic <span>AI Agents</span>
    </div>

    <div class="login-body">

        <p class="muted">Ingresá con tu usuario para continuar.</p>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/login">

            <input type="hidden" name="next" value="{{ next }}">

            <label for="usuario">Usuario</label>
            <input id="usuario" name="usuario" type="text"
                   autocomplete="username" autofocus required>

            <label for="clave">Contraseña</label>
            <input id="clave" name="clave" type="password"
                   autocomplete="current-password" required>

            <button type="submit">Ingresar</button>

        </form>

    </div>

</div>

</body>
</html>
